<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Orbit ERP — AA Builders</title>
<meta name="theme-color" content="#FBF7F0" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D6AB60; --gold-soft:#E6C68A; --gold-deep:#B8924B; --gold-darker:#9C7A3A;
    --ink:#212121; --ink-2:#3a3a3a; --muted:#8a8275; --muted-2:#a59c8a;
    --cream:#FBF7F0; --cream-2:#F5EFE3; --cream-3:#FAF4E8; --row-alt:#FAF4E8;
    --line:#EADFC8; --line-soft:#f0e9d8;
    --green:#2f9e6e; --green-soft:#3eb37f; --green-bg:#E0F1E5;
    --red:#d23b3b; --red-bg:#FFE7E7;
    --shadow: 0 1px 0 rgba(33,33,33,0.04), 0 8px 24px -12px rgba(33,33,33,0.10);
  }
  html,body{background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;}
  html{overflow-y:auto;} body{overflow-y:visible;}
  .font-display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
  .text-gold{color:var(--gold);} .text-gold-deep{color:var(--gold-deep);}
  .ink{color:var(--ink);} .muted{color:var(--muted);}

  /* Brand wordmark: logo + "AA Builders" single line */
  .topbar > div:first-child{display:flex;align-items:center;gap:10px;}
  .brand-text{font-family:'Outfit',sans-serif;font-weight:700;font-size:15.5px;color:var(--gold-deep);letter-spacing:0.16em;line-height:1;white-space:nowrap;text-transform:uppercase;}
  @media(max-width:480px){
    .brand-text{font-size:13.5px;letter-spacing:0.13em;}
  }

  /* Topbar */
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:5px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;min-height:42px;}
  .branch-select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 28px 5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%238a8275' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 9px center;cursor:pointer;min-width:128px;}
  .branch-select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,171,96,0.15);}
  .icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-2);cursor:pointer;transition:all .15s;position:relative;}
  .icon-btn:hover{background:var(--cream-2);}
  .icon-btn.gold{color:var(--gold-deep);}
  .avatar-mark{width:30px;height:30px;border-radius:50%;background:var(--cream-2);border:1.5px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;}
  .user-pill{display:inline-flex;align-items:center;gap:7px;padding:2px 8px 2px 2px;}

  /* Brand area becomes clickable */
  .brand-button{display:flex;align-items:center;gap:9px;cursor:pointer;background:transparent;border:none;padding:3px 6px;margin-left:-6px;border-radius:8px;transition:background .15s;}
  .brand-button:hover{background:var(--cream-2);}
  .brand-button .menu-icon{color:var(--muted-2);transition:color .15s;}
  .brand-button:hover .menu-icon{color:var(--gold-deep);}

  /* Notification badge on icon-btn */
  .icon-btn .notif-dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:999px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;}

  /* Notification popover */
  .notif-popover{position:absolute;top:calc(100% + 6px);right:0;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 36px -12px rgba(33,33,33,0.18),0 4px 10px -4px rgba(33,33,33,0.08);z-index:60;overflow:hidden;}
  .notif-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line-soft);}
  .notif-head h4{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--ink);}
  .notif-head .mark-all{font-size:11.5px;color:var(--gold-deep);font-weight:600;background:none;border:none;cursor:pointer;padding:0;}
  .notif-head .mark-all:hover{text-decoration:underline;}
  .notif-list{max-height:340px;overflow-y:auto;}
  .notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s;}
  .notif-item:hover{background:var(--cream-3);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:#FFFCF5;}
  .notif-item .icon-wrap{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
  .notif-item .icon-wrap.gold{background:#FFF3D9;color:var(--gold-deep);}
  .notif-item .icon-wrap.green{background:var(--green-bg);color:var(--green);}
  .notif-item .icon-wrap.red{background:var(--red-bg);color:var(--red);}
  .notif-item .body{flex:1;min-width:0;}
  .notif-item .title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.35;}
  .notif-item .desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .notif-item .time{font-size:10.5px;color:var(--muted-2);margin-top:3px;display:flex;align-items:center;gap:5px;}
  .notif-item .time .dot{color:var(--red);}
  .notif-empty{padding:32px 14px;text-align:center;color:var(--muted);font-size:13px;}
  .notif-foot{padding:9px 14px;border-top:1px solid var(--line-soft);text-align:center;background:var(--cream-3);}
  .notif-foot a{font-size:12px;color:var(--gold-deep);font-weight:600;cursor:pointer;}
  .notif-foot a:hover{text-decoration:underline;}

  /* Side drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(33,33,33,0.45);backdrop-filter:blur(2px);z-index:55;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .drawer{position:fixed;left:0;top:0;bottom:0;width:280px;background:#fff;z-index:56;box-shadow:8px 0 24px -8px rgba(33,33,33,0.18);display:flex;flex-direction:column;animation:slideIn .22s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  .drawer-head{padding:14px 18px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;}
  .drawer-head .brand-wm{font-family:'Outfit',sans-serif;font-weight:700;font-size:18px;color:var(--gold-deep);letter-spacing:0.16em;line-height:1;text-transform:uppercase;}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 0 12px;}

  /* Top-level nav rows */
  .nav-row{display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:13.5px;color:var(--ink);font-weight:500;cursor:pointer;background:transparent;border:none;width:100%;text-align:left;transition:background .15s;}
  .nav-row:hover{background:var(--cream-3);}
  .nav-row.active{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-deep) 100%);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(184,146,75,0.25);}
  .nav-row.active .nav-ic{color:#fff;}
  .nav-ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;}
  .nav-row:hover .nav-ic{color:var(--gold-deep);}

  /* Sub-items (bulleted list under active section) */
  .nav-sub{padding:4px 0 6px;}
  .nav-sub-item{display:flex;align-items:center;gap:11px;padding:6px 18px 6px 26px;font-size:12.5px;color:var(--ink-2);font-weight:500;cursor:pointer;background:transparent;border:none;width:100%;text-align:left;transition:color .15s;}
  .nav-sub-item:hover{color:var(--ink);}
  .nav-sub-item.active{color:var(--ink);font-weight:700;}
  .nav-sub-item.alert{color:var(--red);}
  .nav-sub-item .bullet{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;display:inline-block;}

  /* Drawer footer (compact, no email) */
  .drawer-foot{padding:10px 14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;background:var(--cream-3);}
  .drawer-foot .info{flex:1;min-width:0;}
  .drawer-foot .info .name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
  .drawer-foot .info .role{font-size:10.5px;color:var(--muted);margin-top:1px;}

  /* Tabs row */
  .tabs-row{background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:0;padding:0 18px;position:sticky;top:42px;z-index:25;}
  .tab{padding:9px 18px;font-size:13.5px;font-weight:600;color:#7a7163;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;background:transparent;border-left:none;border-right:none;border-top:none;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);}
  .tab:hover:not(.active){color:var(--ink-2);}

  .shell{background:var(--cream);min-height:calc(100vh - 90px);padding:12px 18px;}
  @media(max-width:768px){.shell{padding:10px;}}

  /* Card containers */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .ledger-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;}
  .ledger-card .accent{width:5px;background:var(--gold);flex-shrink:0;}
  .ledger-card .body{flex:1;min-width:0;}

  /* Unified top-box (filter strip / stats strip) — same height across tabs */
  .top-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);margin-bottom:10px;min-height:78px;display:flex;align-items:center;}
  .top-box > .top-box-grid{width:100%;display:grid;grid-template-columns:1fr;gap:10px 12px;}
  @media(min-width:640px){.top-box > .top-box-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1024px){.top-box > .top-box-grid{grid-template-columns:repeat(6,1fr);}}
  /* Compact internal controls inside the top-box */
  .top-box .field-label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:3px;}
  .top-box .input{padding:6px 10px;font-size:13px;border-radius:7px;}
  .top-box .select-wrap select{padding:6px 56px 6px 10px;font-size:13px;border-radius:7px;}
  .top-box .stat-readout{gap:3px;}
  .top-box .stat-readout .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  .top-box .stat-readout .val{padding:6px 10px;font-size:13px;min-height:30px;border-radius:7px;}

  /* Report tab — summary box on top right of filter strip */
  .report-summary-box{background:#FAF4E8;border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;gap:2px;min-width:200px;justify-content:center;align-self:end;}
  .report-summary-box .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;line-height:1.35;}
  .report-summary-box .k{color:var(--ink);font-weight:500;}
  .report-summary-box .v{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums;}
  .report-summary-box .row.total{border-top:1px solid var(--line);padding-top:3px;margin-top:1px;}
  @media(max-width:1023px){
    .report-summary-box{min-width:0;}
  }

  /* Report tab — responsive grid override */
  @media(max-width:1023px){
    .report-filter-grid{grid-template-columns:1fr 1fr 1fr !important;}
  }
  @media(max-width:639px){
    .report-filter-grid{grid-template-columns:1fr 1fr !important;}
  }

  /* Report pagination footer */
  .report-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line-soft);flex-wrap:wrap;background:#fff;}
  .report-pagination .page-size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);}
  .report-pagination .page-size select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px;color:var(--ink);background:#fff;cursor:pointer;}
  .report-pagination .page-status{font-size:13px;color:var(--ink-2);}
  .report-pagination .page-status strong{color:var(--ink);font-weight:700;}
  .report-pagination .page-controls{display:flex;align-items:center;gap:4px;}
  .pg-btn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer;transition:all .15s;}
  .pg-btn:hover:not(:disabled){background:var(--cream-2);color:var(--ink-2);}
  .pg-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .pg-btn.pg-num{padding:6px 11px;min-width:32px;}
  .pg-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .pg-btn.active:hover{background:var(--gold-deep);color:#fff;}

  /* Summary tab — dual cross-tab panels */
  .summary-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:12px;}
  @media(max-width:639px){.summary-head{grid-template-columns:1fr;}}
  .summary-pickers{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
  .summary-pickers > div:only-child{grid-column:span 2;}
  .summary-totals{background:#fff;border:1.5px solid #f5b3b3;border-radius:10px;padding:9px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:240px;align-self:stretch;}
  .summary-totals .row{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--ink);font-weight:500;}
  .summary-totals .v{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums;}
  @media(max-width:639px){.summary-totals{min-width:0;}}

  .summary-table{width:100%;border-collapse:separate;border-spacing:0;}
  .summary-table th{font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;padding:11px 14px;background:#FAF4E8;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  .summary-table td{font-size:13px;color:var(--ink-2);padding:11px 14px;vertical-align:middle;border-top:1px solid var(--line-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .summary-table tbody tr:nth-child(even){background:var(--row-alt);}
  .summary-table tbody tr:hover{background:var(--cream-3);}

  .summary-scroll{max-height:calc(100vh - 280px);overflow-y:auto;}
  .summary-scroll::-webkit-scrollbar{width:8px;}
  .summary-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .summary-scroll::-webkit-scrollbar-thumb:hover{background:var(--gold-soft);}
  .summary-scroll::-webkit-scrollbar-track{background:transparent;}

  .status-pending{color:var(--red);font-weight:600;font-size:12.5px;}
  .status-settled{color:var(--green);font-weight:600;font-size:12.5px;}

  /* Form fields — labels above inputs */
  .field-label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;display:block;}
  .field-label .req{color:var(--red);margin-left:2px;}
  .field-label.required{color:var(--red);}
  .input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;width:100%;color:var(--ink);transition:all .15s;}
  .input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,171,96,0.15);}
  .input::placeholder{color:var(--muted-2);}
  .input.readonly, .input:disabled{background:#F2EFE9;color:var(--muted);cursor:not-allowed;}
  .input.empty{background:#F4F0E7;}
  textarea.input{font-family:inherit;resize:vertical;min-height:64px;}

  /* Compact form variant — used in PayForm to fit Description + button in one viewport */
  .form-compact .field-label{font-size:11.5px;margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);}
  .form-compact .field-label.required{color:var(--red);}
  .form-compact .field-label .req{color:var(--red);}
  .form-compact .input{padding:7px 10px;font-size:13px;border-radius:7px;}
  .form-compact .select-wrap select{padding:7px 56px 7px 10px;font-size:13px;border-radius:7px;}
  .form-compact textarea.input{min-height:42px;padding:7px 10px;}
  .form-compact .grid-tight{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .form-compact .field-row{display:flex;flex-direction:column;}

  /* Custom select with × clear button */
  .select-wrap{position:relative;}
  .select-wrap select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 64px 9px 12px;font-size:13.5px;width:100%;color:var(--ink);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%238a8275' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;cursor:pointer;}
  .select-wrap select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,171,96,0.15);}
  .select-wrap .clear-x{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted-2);transition:all .15s;border:none;padding:0;}
  .select-wrap .clear-x:hover{background:var(--cream-2);color:var(--red);}

  /* Stat readouts in filter bar */
  .stat-readout{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .stat-readout .lbl{font-size:13px;font-weight:600;color:var(--ink);}
  .stat-readout .val{background:#F2EFE9;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:38px;display:flex;align-items:center;}

  /* Buttons */
  .pay-btn{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-deep) 100%);color:#fff;font-weight:700;padding:10px 22px;border-radius:8px;font-size:14px;letter-spacing:0.02em;cursor:pointer;border:none;box-shadow:0 4px 12px -4px rgba(184,146,75,0.5);transition:all .15s;}
  .pay-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
  .pay-btn:disabled{opacity:0.5;cursor:not-allowed;background:var(--muted-2);box-shadow:none;}
  .btn-add{border:1px solid var(--green);color:var(--green);font-weight:600;border-radius:8px;padding:7px 12px;font-size:13px;background:#fff;cursor:pointer;transition:all .15s;}
  .btn-add:hover{background:#eafaf2;}
  .btn-ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink-2);cursor:pointer;font-size:13px;font-weight:600;}
  .btn-ghost:hover{background:var(--cream);}

  /* Attach file link */
  .attach-link{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:600;font-size:13px;cursor:pointer;background:transparent;border:none;padding:0;}
  .attach-link:hover{text-decoration:underline;}

  /* Top-right of right card: badge + export links */
  .badge-amount{background:#F2EFE9;border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .export-link{color:var(--red);font-weight:600;font-size:13px;cursor:pointer;background:transparent;border:none;padding:4px 6px;}
  .export-link.green{color:var(--green);}
  .export-link.muted{color:var(--muted);}
  .export-link:hover{text-decoration:underline;}

  /* Tables */
  .ledger-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;}
  .ledger-table th{font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;padding:12px 12px;background:#FAF4E8;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  .ledger-table td{font-size:13px;color:var(--ink-2);padding:12px 12px;vertical-align:middle;border-top:1px solid var(--line-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ledger-table tbody tr:hover{background:var(--cream);}
  .num-cell{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .truncate-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .table-scroll{max-height:480px;overflow-y:auto;overflow-x:auto;}
  .table-scroll::-webkit-scrollbar{width:8px;height:8px;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--gold-soft);}
  .table-scroll::-webkit-scrollbar-track{background:transparent;}

  /* Advance row: form sets natural height, table matches it and scrolls internally */
  .advance-row{display:grid;grid-template-columns:1fr;gap:16px;align-items:stretch;}
  @media(min-width:1024px){
    .advance-row{grid-template-columns:1fr 1fr;}
  }
  .advance-row > *{min-height:0;}
  .advance-row .ledger-card{height:100%;}
  .advance-row .ledger-card > .body{display:flex;flex-direction:column;min-height:0;}
  .advance-row .ledger-card .table-scroll{flex:1 1 0;min-height:0;max-height:none;}

  /* Activity icons */
  .act-cell{display:flex;align-items:center;gap:8px;}
  .act-cell button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:none;padding:0;}
  .act-cell button:hover{opacity:0.75;}

  /* Table View — wide horizontally-scrolling table */
  .tv-scroll{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 280px);cursor:grab;}
  .tv-scroll.dragging{cursor:grabbing;user-select:none;}
  .tv-scroll.dragging *{cursor:grabbing !important;}
  /* Don't grab-scroll when starting on interactive elements */
  .tv-scroll select, .tv-scroll button, .tv-scroll a, .tv-scroll input{cursor:auto;}
  .tv-scroll::-webkit-scrollbar{width:8px;height:10px;}
  .tv-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .tv-scroll::-webkit-scrollbar-thumb:hover{background:var(--gold-soft);}
  .tv-scroll::-webkit-scrollbar-track{background:transparent;}
  .tv-table{border-collapse:separate;border-spacing:0;}
  .tv-table th{font-size:12px;font-weight:700;color:var(--ink);text-align:left;padding:8px 12px;background:#FAF4E8;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  /* Second header row — filter dropdowns / amount subtotals */
  .tv-table th.tv-filter-th{padding:5px 10px;background:#FAF4E8;position:sticky;top:33px;z-index:2;border-bottom:1px solid var(--line);font-weight:600;}
  .tv-table td{font-size:12.5px;color:var(--ink-2);padding:7px 12px;vertical-align:middle;border-top:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tv-table tbody tr:nth-child(even){background:var(--row-alt);}
  .tv-table tbody tr:hover{background:var(--cream-3);}

  /* Column-header filter dropdown — compact, fits inside narrow column widths */
  .col-filter{position:relative;width:100%;}
  .col-filter select{width:100%;font-size:11.5px;padding:4px 22px 4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink-2);font-weight:500;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%238a8275' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer;}
  .col-filter select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(214,171,96,0.18);}
  .col-filter select.active{border-color:var(--gold);background-color:var(--cream-2);color:var(--ink);font-weight:600;}

  /* Subtotal cell in filter row (for amount columns) */
  .col-subtotal{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--gold-deep);text-align:right;font-variant-numeric:tabular-nums;padding:8px 14px 8px 0;}

  /* Filter chips row above the table (deprecated — replaced by tv-toolbar) */
  .tv-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:#FFFCF5;min-height:46px;}
  .tv-chips .empty{font-size:12.5px;color:var(--muted);font-style:italic;}

  /* Unified toolbar: filter button + inline chips + count + refresh/PDF/XL */
  .tv-toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line-soft);min-height:42px;flex-wrap:wrap;}
  .tv-toolbar .filter-btn{width:30px;height:30px;}
  .tv-toolbar .icon-btn{width:30px;height:30px;}
  .tv-toolbar .icon-tile{height:30px;padding:0 8px;font-size:12px;}
  .tv-chips-inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0;}
  .tv-count{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tv-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;background:#fff;border:1px solid var(--gold-soft);color:var(--ink);font-size:12px;font-weight:600;border-radius:999px;}
  .tv-chip .k{color:var(--muted);font-weight:500;font-size:11px;}
  .tv-chip .x{width:18px;height:18px;border-radius:50%;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted-2);transition:all .15s;border:1px solid var(--line);}
  .tv-chip .x:hover{background:#FFE7E7;color:var(--red);border-color:#fadcdc;}
  .tv-chip-clear{background:transparent;border:none;color:var(--red);font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px;}
  .tv-chip-clear:hover{background:#FFE7E7;}

  .icon-tile{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .15s;}
  .icon-tile:hover{background:var(--cream-2);}
  .icon-tile.pdf{color:#d23b3b;border-color:#fadcdc;}
  .icon-tile.pdf:hover{background:#fff4f4;}
  .icon-tile.xl{color:var(--green);border-color:#cce8d8;}
  .icon-tile.xl:hover{background:#eafaf2;}
  .icon-tile .lbl{font-size:11.5px;letter-spacing:0.04em;}

  .view-link{color:var(--red);font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:underline;}
  .view-link:hover{color:var(--gold-deep);}
  .icon-edit{display:inline-flex;cursor:pointer;background:transparent;border:none;padding:0;}
  .icon-edit:hover{opacity:0.75;}

  /* Filter button — gold border with optional count dot */
  .filter-btn{position:relative;width:36px;height:36px;border:1px solid var(--gold);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
  .filter-btn:hover{background:var(--cream-2);}
  .filter-btn .dot{position:absolute;top:-3px;right:-3px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(33,33,33,0.55);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.modal-bg{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow-y:auto;}
  @media (min-width:640px){.modal{border-radius:18px;}}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);}
  .badge-build{position:fixed;bottom:10px;right:12px;background:rgba(33,33,33,0.85);color:#fff;font-size:10px;letter-spacing:.05em;padding:4px 8px;border-radius:6px;z-index:60;font-weight:600;}

  /* Mobile cards for transactions */
  .mob-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;}
  .mob-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);}
  @media(max-width:1023px){
    .desk-table{display:none;}
    .mob-cards{display:block;}
  }
  @media(min-width:1024px){
    .desk-table{display:block;}
    .mob-cards{display:none;}
  }

  @media(max-width:768px){
    .tabs-row{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 12px;}
    .tabs-row::-webkit-scrollbar{display:none;}
    .tab{padding:12px 12px;font-size:13px;}
    .topbar{padding:10px 12px;gap:8px;}
    .topbar .desktop-only{display:none;}
  }
</style>

  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);

  return new TextDecoder("utf-8").decode(bytes);

// Auto-assign sequential id, eNo, default source, refundType, timestamp — newest entry gets highest eNo
const SEED_TX = _RAW
  .slice()
  .sort((a,b) => { const pa=a.date.split("/").reverse().join(""); const pb=b.date.split("/").reverse().join(""); return pa.localeCompare(pb); })
  .map((t,i) => {
    // Deterministic timestamp = transaction date + plausible time-of-entry (between 9am and 7pm)
    const [d,m,y] = t.date.split("/");
    const hour = 9 + (i * 7) % 11;          // 9-19
    const min  = (i * 13) % 60;
    const sec  = (i * 23) % 60;
    const ts   = `${d}/${m}/${y} ${String(hour).padStart(2,"0")}:${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    return {
      id: i+1,
      eNo: 8350 + i,
      timestamp: ts,
      transferSite: t.transferSite || "",
      refundType: t.refundType || (t.type==="Bill" ? "Bill Settlement" : t.type==="Advance" ? "Advance" : t.type),
      source: t.source || (t.mode==="Cash" ? "Cash Register" : "Advance Portal"),
      branch: t.branch || "Srivilliputtur",
      enteredBy: t.enteredBy || "Admin",
      file: t.file || false,
      ...t,
    };
  })
  .reverse(); // newest first for display

// ---------- Drag-to-scroll (grab-scroll) hook ----------
// Lets the user pan the table by clicking and dragging anywhere except interactive elements.
const useDragScroll = () => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    let isDown = false;
    let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;
    let moved = false;
    const INTERACTIVE = "select, button, a, input, textarea, label, [role='button']";

    const onDown = (e) => {
      // Skip when click starts on an interactive element (dropdown, button, link, etc.)
      if(e.target.closest && e.target.closest(INTERACTIVE)) return;
      // Only respond to primary button
      if(e.button !== undefined && e.button !== 0) return;
      isDown = true;
      moved = false;
      el.classList.add("dragging");
      startX = (e.pageX || e.touches?.[0].pageX) - el.offsetLeft;
      startY = (e.pageY || e.touches?.[0].pageY) - el.offsetTop;
      scrollLeft = el.scrollLeft;
      scrollTop  = el.scrollTop;
    };
    const onMove = (e) => {
      if(!isDown) return;
      const x = (e.pageX || e.touches?.[0].pageX) - el.offsetLeft;
      const y = (e.pageY || e.touches?.[0].pageY) - el.offsetTop;
      const dx = x - startX, dy = y - startY;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3){ moved = true; e.preventDefault?.(); }
      el.scrollLeft = scrollLeft - dx;
      el.scrollTop  = scrollTop - dy;
    };
    const onUp = () => {
      isDown = false;
      el.classList.remove("dragging");
    };
    // Suppress click on cells if a drag actually moved the table — prevents accidental row "clicks"
    const onClickCapture = (e) => {
      if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
    };

    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, {passive:true});
    el.addEventListener("touchmove", onMove, {passive:false});
    el.addEventListener("touchend", onUp);
    el.addEventListener("click", onClickCapture, true);
    return () => {
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      el.removeEventListener("touchstart", onDown);
      el.removeEventListener("touchmove", onMove);
      el.removeEventListener("touchend", onUp);
      el.removeEventListener("click", onClickCapture, true);
    };
  }, []);
  return ref;
};

// ISO-week helpers: ISO week starts Monday, week 1 contains Jan 4
const isoWeekRange = (year, week) => {
  // Find Jan 4 (always in week 1 by ISO def), then find Monday of that week
  const jan4 = new Date(year, 0, 4);
  const dayOfWeek = (jan4.getDay() + 6) % 7;        // 0=Mon..6=Sun
  const week1Mon = new Date(jan4); week1Mon.setDate(jan4.getDate() - dayOfWeek);
  const start = new Date(week1Mon); start.setDate(week1Mon.getDate() + (week-1)*7);
  const end = new Date(start); end.setDate(start.getDate() + 4); // show Mon-Fri (work week)
  const fmt = (d) => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  return {start, end, fromStr:fmt(start), toStr:fmt(end)};
};
const isoWeekOfDate = (d) => {
  const target = new Date(d);
  target.setHours(0,0,0,0);
  target.setDate(target.getDate() + 3 - ((target.getDay()+6)%7));
  const week1 = new Date(target.getFullYear(),0,4);
  return Math.round(((target - week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7) + 1;
};

    const cy = today.getFullYear();
    return [cy+1, cy, cy-1, cy-2];

  const range = useMemo(() => {

      return {start:s, end:e, fromStr:fmt(s), toStr:fmt(e)};

};

// ---------- Summary tab — dual cross-tab view ----------
// One sub-panel groups data by Project (filtered by selected contractor); the other groups by Contractor (filtered by selected project)
const SummaryPanel = ({title, picker, secondaryPicker, totals, rows, groupCol, exportName}) => {
  // Bill Status: pending if (advance - bill - refund) > 0, else settled
  const isPending = (r) => (r.advance - r.bill - r.refund) > 0;

  const exportPDF = () => {
    const w = window.open("","_blank");
    if(!w) return;
    const tr = rows.map(r => `<tr><td>${r.label}</td><td style="text-align:right">${fmtINR(r.advance)}</td><td style="text-align:right">${fmtINR(r.bill)}</td><td style="color:${isPending(r)?'#d23b3b':'#2f9e6e'}">${isPending(r)?'Pending':'Settled'}</td></tr>`).join("");
    w.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>body{font-family:Arial;padding:18px;font-size:11px}h1{font-size:16px;color:#B8924B;margin:0 0 4px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #EADFC8;padding:5px 8px;text-align:left;font-size:10px}th{background:#FAF4E8}tr:nth-child(even){background:#FAF4E8}</style></head><body>
      <h1>AA Builders — ${title}</h1>
      <div style="font-size:11px;color:#555;margin-bottom:10px">Pending Advance: ₹${fmtINR(totals.advance)} · Bill Amount: ₹${fmtINR(totals.bill)}</div>
      <table><thead><tr><th>${groupCol}</th><th style="text-align:right">Advance</th><th style="text-align:right">Bill Amount</th><th>Bill Status</th></tr></thead><tbody>${tr}</tbody></table>
      <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`);
    w.document.close();
  };
  const exportXL = () => {
    const lines = [`${groupCol},Advance,Bill Amount,Bill Status`];
    rows.forEach(r => lines.push([`"${r.label}"`, r.advance, r.bill, isPending(r)?"Pending":"Settled"].join(",")));
    const blob = new Blob([lines.join("\n")], {type:"text/csv"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${exportName}.csv`; a.click();
  };

  return (
    <div>
      {/* Picker row + totals card */}
      <div className="summary-head">
        <div className="summary-pickers">
          {picker}
          {secondaryPicker}
        </div>
        <div className="summary-totals">
          <div className="row">
            <span className="k">Pending Advance:</span>
            <span className="v">{fmtINR(totals.advance)}</span>
          </div>
          <div className="row">
            <span className="k">Bill Amount:</span>
            <span className="v">{fmtINR(totals.bill)}</span>
          </div>
        </div>
      </div>

      {/* Export links */}
      <div className="flex items-center justify-end gap-1 mt-2 mb-2">
        <button className="export-link" onClick={exportPDF}>Export PDF</button>
        <button className="export-link green" onClick={exportXL}>Export XL</button>
        <button className="export-link muted" onClick={()=>window.print()}>Print</button>
      </div>

      {/* Table */}
      <div className="ledger-card">
        <div className="accent"/>
        <div className="body">
          <div className="summary-scroll">
            <table className="summary-table">
              <thead>
                <tr>
                  <th>{groupCol}</th>
                  <th style={{textAlign:"right"}}>Advance</th>
                  <th style={{textAlign:"right"}}>Bill Amount</th>
                  <th>Bill Status</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i) => (
                  <tr key={r.label+i}>
                    <td className="ink truncate-cell" title={r.label}>{r.label}</td>
                    <td className="num-cell" style={{textAlign:"right"}}>{fmtINR(r.advance)}</td>
                    <td className="num-cell" style={{textAlign:"right"}}>{fmtINR(r.bill)}</td>
                    <td><span className={isPending(r)?"status-pending":"status-settled"}>{isPending(r)?"Pending":"Settled"}</span></td>
                  </tr>
                ))}
                {rows.length === 0 && <tr><td colSpan={4} className="text-center py-8 muted">No data for this selection.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
};

const SummaryTab = ({transactions}) => {
  const [leftParty,setLeftParty] = useState("Murugan Centring");
  const [leftProject,setLeftProject] = useState("");
  const [rightProject,setRightProject] = useState("");

  // ----- LEFT panel: group by Project, filtered by leftParty + leftProject -----
  const leftRows = useMemo(() => {
    const filtered = transactions.filter(t =>
      (!leftParty   || t.party   === leftParty) &&
      (!leftProject || t.project === leftProject)
    );
    const byProject = {};
    filtered.forEach(t => {
      if(!byProject[t.project]) byProject[t.project] = {advance:0, bill:0, refund:0};
      byProject[t.project].advance += t.advance;
      byProject[t.project].bill    += t.bill;
      byProject[t.project].refund  += t.transferRefund;
    });
    return Object.entries(byProject)
      .map(([p,v]) => ({label:p, ...v}))
      .sort((a,b) => b.advance - a.advance);
  }, [transactions, leftParty, leftProject]);

  const leftTotals = useMemo(() => ({
    advance: leftRows.reduce((s,r) => s + r.advance - r.bill - r.refund, 0),
    bill: leftRows.reduce((s,r) => s + r.bill, 0),
  }), [leftRows]);

  // ----- RIGHT panel: group by Contractor, filtered by rightProject -----
  const rightRows = useMemo(() => {
    const filtered = transactions.filter(t => !rightProject || t.project === rightProject);
    const byParty = {};
    filtered.forEach(t => {
      if(!byParty[t.party]) byParty[t.party] = {advance:0, bill:0, refund:0};
      byParty[t.party].advance += t.advance;
      byParty[t.party].bill    += t.bill;
      byParty[t.party].refund  += t.transferRefund;
    });
    return Object.entries(byParty)
      .map(([p,v]) => ({label:p, ...v}))
      .sort((a,b) => b.advance - a.advance);
  }, [transactions, rightProject]);

  const rightTotals = useMemo(() => ({
    advance: rightRows.reduce((s,r) => s + r.advance - r.bill - r.refund, 0),
    bill: rightRows.reduce((s,r) => s + r.bill, 0),
  }), [rightRows]);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <SummaryPanel
        title="Project breakdown for contractor"
        picker={
          <div>
            <label className="field-label">Contractor/Vendor</label>
            <SelectWithClear value={leftParty} onChange={setLeftParty} options={PARTIES} placeholder="Select party"/>
          </div>
        }
        secondaryPicker={
          <div>
            <label className="field-label">Project Name</label>
            <SelectWithClear value={leftProject} onChange={setLeftProject} options={PROJECTS} placeholder="Select..."/>
          </div>
        }
        totals={leftTotals}
        rows={leftRows}
        groupCol="Project Name"
        exportName={`Summary_Projects_${(leftParty||"All").replace(/\s+/g,"_")}`}
      />
      <SummaryPanel
        title="Contractor breakdown for project"
        picker={
          <div>
            <label className="field-label">Project Name</label>
            <SelectWithClear value={rightProject} onChange={setRightProject} options={PROJECTS} placeholder="Select a project..."/>
          </div>
        }
        secondaryPicker={null}
        totals={rightTotals}
        rows={rightRows}
        groupCol="Contractor/Vendor"
        exportName={`Summary_Contractors_${(rightProject||"All").replace(/\s+/g,"_")}`}
      />
    </div>
  );
};

// ---------- App ----------
const App = () => {
  const [tab,setTab] = useState("Advance");
  const [branch,setBranch] = useState("srivilliputtur");
  // Active module: "project-advance" (this app's own UI), "cash-register", or "bank-register" (embedded iframes)
  const [activeModule,setActiveModule] = useState("project-advance");
  const [transactions,setTransactions] = useState(SEED_TX);
  const [filter,setFilter] = useState({from:"", to:"", amount:"", mode:""});
  const [form,setForm] = useState({
    type:"Advance", date:todayISO(), party:"Murugan Centring", project:"Muthuraj Complex - Krishnankovil",
    amount:"", mode:"", description:""
  });
  const [attachedFile,setAttachedFile] = useState(null);
  const [toast,setToast] = useState("");
  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(""),2200); };
  const [drawerOpen,setDrawerOpen] = useState(false);
  const [notifOpen,setNotifOpen] = useState(false);
  const [notifications,setNotifications] = useState([
    {id:1, tone:"gold",  emoji:"💰", title:"Advance recorded", desc:"₹15,000 paid to Selvam Mason for Karthik VPM project", time:"2 min ago", read:false},
    {id:2, tone:"green", emoji:"✓",  title:"Bill settled",      desc:"Mani Centring · Saradha-Malli · ₹1,71,000 cleared", time:"1 hour ago", read:false},
    {id:3, tone:"red",   emoji:"!",  title:"Pending approval",  desc:"3 advance entries by Sivaprakasm need admin review",   time:"3 hours ago", read:false},
    {id:4, tone:"gold",  emoji:"📎", title:"Receipt attached",  desc:"Bill receipt uploaded for Rahul Fencing entry #8361", time:"yesterday", read:true},
    {id:5, tone:"green", emoji:"📊", title:"Weekly report ready", desc:"Week 18 report generated — ₹4.7L total advances",   time:"2 days ago", read:true},
  ]);
  const markAllRead = () => setNotifications(prev => prev.map(n => ({...n, read:true})));
  const handleNotifClick = (n) => {
    setNotifications(prev => prev.map(x => x.id === n.id ? {...x, read:true} : x));
    showToast(`Opening: ${n.title}`);
    setNotifOpen(false);
  };

  // --- Computed values ---
  // Overall Advance = total advances paid to selected contractor (all projects), minus bills/refunds
  const overallAdvance = useMemo(() => {
    if(!form.party) return 0;
    return transactions
      .filter(t => t.party === form.party)
      .reduce((s,t) => s + t.advance - t.bill - t.transferRefund, 0);
  }, [transactions, form.party]);

  // Project Advance = same calc for the (party, project) pair
  const projectAdvance = useMemo(() => {
    if(!form.party || !form.project) return 0;
    return transactions
      .filter(t => t.party === form.party && t.project === form.project)
      .reduce((s,t) => s + t.advance - t.bill - t.transferRefund, 0);
  }, [transactions, form.party, form.project]);

  // Today amount & total outstanding for top-right stats
  const todayAmount = useMemo(() => {
    const today = ddmmyyyy(todayISO());
    return transactions.filter(t => t.date === today).reduce((s,t) => s + t.advance, 0);
  }, [transactions]);

  const totalOutstanding = useMemo(() => {
    // Sum of net advance positions across all parties
    const byParty = {};
    transactions.forEach(t => {
      byParty[t.party] = (byParty[t.party]||0) + t.advance - t.bill - t.transferRefund;
    });
    return Object.values(byParty).reduce((s,n) => s + Math.max(0,n), 0);
  }, [transactions]);

  // Rows for the right table — filter to (selected party + project), then apply top filter
  const filteredRows = useMemo(() => {
    let rows = transactions;
    if(form.party) rows = rows.filter(t => t.party === form.party);
    if(form.project) rows = rows.filter(t => t.project === form.project);

    // Top filter: from/to date, amount, mode
    if(filter.from) rows = rows.filter(t => {
      const [d,m,y] = t.date.split("/");
      return new Date(+y,+m-1,+d) >= new Date(filter.from);
    });
    if(filter.to) rows = rows.filter(t => {
      const [d,m,y] = t.date.split("/");
      return new Date(+y,+m-1,+d) <= new Date(filter.to);
    });
    if(filter.amount) rows = rows.filter(t => t.advance >= Number(filter.amount));
    if(filter.mode) rows = rows.filter(t => t.mode === filter.mode);

    // Sort newest first
    return [...rows].sort((a,b) => {
      const da = a.date.split("/").reverse().join("");
      const db = b.date.split("/").reverse().join("");
      return db.localeCompare(da);
    });
  }, [transactions, form.party, form.project, filter]);

  const handleSubmit = () => {
    const newTx = {
      id: Date.now(),
      date: ddmmyyyy(form.date),
      party: form.party,
      project: form.project,
      type: form.type,
      advance: form.type === "Advance" ? Number(form.amount) : 0,
      bill: form.type === "Bill" ? Number(form.amount) : 0,
      transferRefund: (form.type === "Transfer" || form.type === "Refund") ? Number(form.amount) : 0,
      mode: form.mode,
      description: form.description,
    };
    setTransactions([newTx, ...transactions]);
    setForm({...form, amount:"", description:""});
    setAttachedFile(null);
    showToast(`${form.type} of ₹${fmtINR(form.amount)} recorded for ${form.party}`);
  };

  const handleAttach = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*,application/pdf";
    inp.onchange = (e) => {
      const f = e.target.files[0];
      if(f){ setAttachedFile(f); showToast(`Attached: ${f.name}`); }
    };
    inp.click();
  };

  const handleExport = (kind) => {
    if(kind === "print"){ window.print(); return; }
    if(kind === "xl"){
      const lines = ["Date,Advance,Bill,Transfer/Refund,Mode,Description"];
      filteredRows.forEach(r => lines.push([r.date, r.advance, r.bill, r.transferRefund, r.mode, `"${r.description||""}"`].join(",")));
      const blob = new Blob([lines.join("\n")], {type:"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Advance_${form.party||"all"}_${form.project||"all"}.csv`.replace(/\s+/g,"_");
      a.click();
      showToast("Excel exported");
      return;
    }
    // PDF: open print window
    const w = window.open("","_blank");
    if(!w){ showToast("Popup blocked"); return; }
    const fmt = (n) => n>0 ? "₹"+fmtINR(n) : "—";
    const rows = filteredRows.map(r => `<tr><td>${r.date}</td><td style="text-align:right">${fmt(r.advance)}</td><td style="text-align:right">${fmt(r.bill)}</td><td style="text-align:right">${fmt(r.transferRefund)}</td><td>${r.mode}</td></tr>`).join("");
    w.document.write(`<!DOCTYPE html><html><head><title>Advance Report</title>
      <style>body{font-family:Arial;padding:24px;color:#212121;}h1{font-size:18px;color:#B8924B;margin:0 0 4px;}
      .meta{color:#555;font-size:12px;margin-bottom:14px;}
      table{width:100%;border-collapse:collapse;}th,td{border:1px solid #EADFC8;padding:6px 8px;font-size:11px;text-align:left;}
      th{background:#FAF4E8;}.totals{background:#F5EFE3;font-weight:700;}</style></head><body>
      <h1>AA Builders — Project Advance Report</h1>
      <div class="meta">Contractor: <b>${form.party||"all"}</b> · Project: <b>${form.project||"all"}</b> · Generated ${new Date().toLocaleString("en-IN")}</div>
      <table><thead><tr><th>Date</th><th style="text-align:right">Advance</th><th style="text-align:right">Bill</th><th style="text-align:right">Transfer/Refund</th><th>Mode</th></tr></thead>
      <tbody>${rows}<tr class="totals"><td>Project Advance Outstanding</td><td colspan="4" style="text-align:right">₹${fmtINR(projectAdvance)}</td></tr></tbody></table>
      <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`);
    w.document.close();
    showToast("PDF window opened");
  };

  return (
    <div>
      <TopBar
        branch={branch} setBranch={setBranch}
        onLogoClick={()=>setDrawerOpen(true)}
        notifications={notifications}
        notifOpen={notifOpen} setNotifOpen={setNotifOpen}
        onMarkAllRead={markAllRead}
        onNotifClick={handleNotifClick}
      />
      <SideDrawer
        open={drawerOpen}
        onClose={()=>setDrawerOpen(false)}
        currentTab={tab} setTab={setTab}
        activeModule={activeModule}
        setActiveModule={(m)=>{ setActiveModule(m); setDrawerOpen(false); }}
      />
      {activeModule !== "project-advance" && (
        <iframe
          title={activeModule}
          srcDoc={decodeModule(activeModule === "cash-register" ? CASH_HTML_B64 : BANK_HTML_B64)}
          style={{position:"fixed",left:0,top:42,right:0,bottom:0,width:"100vw",height:"calc(100vh - 42px)",border:"none",background:"#fbf7f0",zIndex:10}}
        />
      )}
      {activeModule === "project-advance" && <TabsRow tab={tab} setTab={setTab}/>}

      {activeModule === "project-advance" && <div className="shell">
        {tab === "Advance" && (
          <>
            <FilterBar filter={filter} setFilter={setFilter} todayAmount={todayAmount} totalOutstanding={totalOutstanding}/>

            <div className="advance-row">
              <PayForm
                form={form} setForm={setForm}
                overallAdvance={overallAdvance}
                projectAdvance={projectAdvance}
                onSubmit={handleSubmit}
                onAttach={handleAttach}
                attachedFile={attachedFile}
              />
              <TxTable
                rows={filteredRows}
                projectAdvance={projectAdvance}
                onEdit={(r)=>showToast(`Edit ${r.date} entry — coming soon`)}
                onView={(r)=>showToast(`Receipt for ${r.date}`)}
                onExport={handleExport}
              />
            </div>
          </>
        )}

        {tab === "Table View" && <TableView transactions={transactions}/>}

        {tab === "Database" && <TableView transactions={transactions} showTimestamp={true}/>}

        {tab === "Report" && <ReportTab transactions={transactions}/>}

        {tab === "Summary" && <SummaryTab transactions={transactions}/>}
      </div>}

      {toast && <div className="toast">{toast}</div>}
      <div className="badge-build">ORBIT ERP · BUILD {BUILD}</div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
console.log("%cOrbit ERP — AA Builders","color:#D6AB60;font-weight:700;font-size:13px;","build", BUILD);
</script>
</body>
</html>
